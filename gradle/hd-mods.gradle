// Four independent mods, bundled by default; activation belongs to Severed Chains.
['EnvHD': 'envhd', 'UIHD': 'uihd', 'FxHD': 'fxhd'].each { title, id ->
  final String releaseVersion = title == "UIHD" ? "0.2.0" : "0.1.0"
  final def root = file("integrations/${id}")
  final def output = layout.buildDirectory.dir("${id}/classes")
  final def compileMod = tasks.register("compile${title}", JavaCompile) {
    dependsOn classes
    source fileTree(new File(root, 'src/main/java')) { include '**/*.java' }
    classpath = sourceSets.main.output + configurations.compileClasspath
    destinationDirectory = output
    options.release = 25
    options.encoding = 'UTF-8'
  }
  tasks.register("${id}Jar", Jar) {
    dependsOn compileMod, jar
    archiveFileName = "${title}-v${releaseVersion}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs/mods')
    from output
    from new File(root, 'src/main/resources')
    from new File(root, 'runtime-assets')
    into("META-INF/${id}") { from 'LICENSE'; from new File(root, 'README.md'); from new File(root, 'ARTWORK-NOTICES.txt') }
    manifest { attributes 'Implementation-Title': title, 'Implementation-Version': releaseVersion }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
  }
  tasks.named('build') { dependsOn "${id}Jar" }
  tasks.named('stageDefinitivePackage') { dependsOn "${id}Jar" }
}
