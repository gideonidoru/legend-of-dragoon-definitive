// FMVHD source is compiled here; its large video payload comes from a checksum-pinned release.
sourceSets {
  fmvhd {
    java.srcDir 'integrations/fmvhd/src/main/java'
    resources.srcDir 'integrations/fmvhd/src/main/resources'
    compileClasspath += sourceSets.main.output + configurations.compileClasspath
  }
}
sourceSets.test.compileClasspath += sourceSets.fmvhd.output
sourceSets.test.runtimeClasspath += sourceSets.fmvhd.output

// Source and runtime share these exact immutable per-film objects. The historical
// ZIP is accepted only as an explicitly supplied local bootstrap, never emitted.
tasks.register('fmvHdAssets') {
  final def local = providers.gradleProperty('fmvHdAssets')
  inputs.files(fileTree('integrations/fmvhd/src/main/resources/fmvhd'))
  inputs.file('scripts/stage-fmvhd-assets.py')
  inputs.file('scripts/package_validation.py')
  inputs.property('localAssets', local.getOrElse(''))
  if(local.isPresent()) inputs.files(file(local.get()))
  outputs.dir(layout.buildDirectory.dir('fmvhd/assets'))
  doLast {
    final def command = ['python3', 'scripts/stage-fmvhd-assets.py', '--manifest', 'integrations/fmvhd/src/main/resources/fmvhd/assets.properties', '--output', layout.buildDirectory.dir('fmvhd/assets').get().asFile.absolutePath]
    if(local.isPresent()) command.addAll(['--local', file(local.get()).absolutePath])
    final def execution = providers.exec { commandLine command }
    final def result = execution.result.get()
    logger.lifecycle(execution.standardOutput.asText.get())
    if(result.exitValue != 0) throw new GradleException(execution.standardError.asText.get())
    result.assertNormalExitValue()
  }
}

tasks.register('fmvHdJar', Jar) {
  dependsOn sourceSets.fmvhd.classesTaskName, tasks.named('jar')
  archiveFileName = 'FMVHD-v0.1.0.jar'
  destinationDirectory = layout.buildDirectory.dir('libs/mods')
  from sourceSets.fmvhd.output
  into('META-INF/fmvhd') { from 'LICENSE'; from 'integrations/fmvhd/README.md' }
  manifest { attributes 'Implementation-Title': 'FMVHD', 'Implementation-Version': '0.1.0' }
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}
tasks.named('compileTestJava') { dependsOn sourceSets.fmvhd.classesTaskName }
tasks.named('stageDefinitivePackage') { dependsOn tasks.named('fmvHdJar') }
tasks.named('build') { dependsOn tasks.named('fmvHdJar') }
tasks.named('deliveryTest') {
  environment 'ALSOFT_DRIVERS', 'null'
  if(providers.gradleProperty('fmvTailFixture').isPresent()) systemProperty 'fmvhd.tailFixture', providers.gradleProperty('fmvTailFixture').get()
  if(providers.gradleProperty('fmvFixture').isPresent()) systemProperty 'fmvhd.fixture', providers.gradleProperty('fmvFixture').get()
}

tasks.named('stageDefinitivePackage') {
  dependsOn tasks.named('fmvHdAssets')
  into('gfx/fmvhd') { from layout.buildDirectory.dir('fmvhd/assets') }
}

tasks.register('originalMovieSourceProbe', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.fmv.OriginalMovieSourceProbe'
  systemProperty 'java.awt.headless', 'true'
  environment 'ALSOFT_DRIVERS', 'null'
  doFirst { args providers.gradleProperty('fmvOriginalFiles').get() }
}

tasks.register('originalFmvHandoffProbe', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.fmv.OriginalFmvHandoffProbe'
  systemProperty 'java.awt.headless', 'true'
  jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
  environment 'ALSOFT_DRIVERS', 'null'
  doFirst { args providers.gradleProperty('fmvOriginalFile').get() }
}

tasks.register('fmvSplitSourceProbe', JavaExec) {
  dependsOn testClasses, tasks.named('fmvHdAssets'), tasks.named('fmvHdJar')
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.manager.FmvSplitSourceProbe'
  systemProperty 'java.awt.headless', 'true'
  environment 'ALSOFT_DRIVERS', 'null'
  doFirst {
    args layout.buildDirectory.dir('fmvhd/assets').get().asFile.absolutePath,
      tasks.named('fmvHdJar').get().archiveFile.get().asFile.absolutePath,
      providers.gradleProperty('fmvLegacyRelease').get()
  }
}
