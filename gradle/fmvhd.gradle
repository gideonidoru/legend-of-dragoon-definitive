// FMVHD source is compiled here; its large video payload comes from a checksum-pinned release.
sourceSets {
  fmvhd {
    java.srcDir 'integrations/fmvhd/src/main/java'
    resources.srcDir 'integrations/fmvhd/src/main/resources'
    compileClasspath += sourceSets.main.output + configurations.compileClasspath
  }
}
sourceSets.test.compileClasspath += sourceSets.fmvhd.output
sourceSets.test.runtimeClasspath += sourceSets.fmvhd.output

// Runtime uses immutable per-film objects; format-1 publication still requires its pinned source ZIP.
// Temporary format-1 build/export bridge. Never embed this source ZIP in the small code JAR.
tasks.register('fmvHdLegacySource') {
  final def local = providers.gradleProperty('fmvHdAssets')
  inputs.files('integrations/fmvhd/release.properties', 'integrations/fmvhd/src/main/resources/fmvhd/assets.properties', 'scripts/retain-fmvhd-source.py', 'scripts/package_validation.py')
  inputs.property('localAssets', local.getOrElse(''))
  if(local.isPresent() && file(local.get()).isFile()) inputs.file(file(local.get()))
  outputs.file(layout.buildDirectory.file('fmvhd/videos.zip'))
  outputs.upToDateWhen { false } // Recheck immutable cached bytes before reuse/export.
  doLast {
    if(local.isPresent() && !file(local.get()).isFile() && !file(local.get()).isDirectory()) throw new GradleException('FMV source path does not exist: ' + local.get())
    final def command = ['python3', 'scripts/retain-fmvhd-source.py', '--lock', 'integrations/fmvhd/release.properties', '--manifest', 'integrations/fmvhd/src/main/resources/fmvhd/assets.properties', '--output', layout.buildDirectory.file('fmvhd/videos.zip').get().asFile.absolutePath]
    if(local.isPresent() && file(local.get()).isFile()) command.addAll(['--local', file(local.get()).absolutePath])
    final def execution = providers.exec { commandLine command }
    final def result = execution.result.get()
    logger.lifecycle(execution.standardOutput.asText.get())
    if(result.exitValue != 0) throw new GradleException(execution.standardError.asText.get())
    result.assertNormalExitValue()
  }
}

tasks.register('fmvHdAssets') {
  final def local = providers.gradleProperty('fmvHdAssets')
  final def memberDelivery = providers.gradleProperty('currentDeliveryFormat').getOrElse('2') == '2'
  if(!memberDelivery && (!local.isPresent() || !file(local.get()).isDirectory())) dependsOn tasks.named('fmvHdLegacySource')
  if(memberDelivery && local.isPresent() && file(local.get()).isFile()) dependsOn tasks.named('fmvHdLegacySource')
  inputs.file('integrations/fmvhd/release.properties')
  inputs.files(fileTree('integrations/fmvhd/src/main/resources/fmvhd'))
  inputs.files('scripts/stage-fmvhd-assets.py', 'scripts/stage-current-fmvhd-assets.py', 'scripts/member_publication.py', 'scripts/current_publication.py', 'scripts/prepare-publication-delta.py')
  inputs.file('scripts/package_validation.py')
  inputs.property('localAssets', local.getOrElse(''))
  if(local.isPresent() && file(local.get()).isDirectory()) inputs.files(file(local.get()))
  else if(!memberDelivery || local.isPresent()) inputs.file(tasks.named('fmvHdLegacySource').map { it.outputs.files.singleFile })
  inputs.property('memberDelivery', memberDelivery)
  outputs.dir(layout.buildDirectory.dir('fmvhd/assets'))
  doLast {
    final def command = ['python3', memberDelivery && !local.isPresent() ? 'scripts/stage-current-fmvhd-assets.py' : 'scripts/stage-fmvhd-assets.py', '--manifest', 'integrations/fmvhd/src/main/resources/fmvhd/assets.properties', '--output', layout.buildDirectory.dir('fmvhd/assets').get().asFile.absolutePath]
    if(local.isPresent() && file(local.get()).isDirectory()) command.addAll(['--local', file(local.get()).absolutePath])
    else if(!memberDelivery || local.isPresent()) command.addAll(['--local', layout.buildDirectory.file('fmvhd/videos.zip').get().asFile.absolutePath])
    final def execution = providers.exec { commandLine command }
    final def result = execution.result.get()
    logger.lifecycle(execution.standardOutput.asText.get())
    if(result.exitValue != 0) throw new GradleException(execution.standardError.asText.get())
    result.assertNormalExitValue()
  }
}

tasks.register('fmvHdJar', Jar) {
  dependsOn sourceSets.fmvhd.classesTaskName, tasks.named('jar')
  archiveFileName = 'FMVHD-v0.1.0.jar'
  destinationDirectory = layout.buildDirectory.dir('libs/mods')
  from sourceSets.fmvhd.output
  into('META-INF/fmvhd') { from 'LICENSE'; from 'integrations/fmvhd/README.md' }
  manifest { attributes 'Implementation-Title': 'FMVHD', 'Implementation-Version': '0.1.0' }
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}
tasks.named('compileTestJava') { dependsOn sourceSets.fmvhd.classesTaskName }
tasks.named('stageDefinitivePackage') { dependsOn tasks.named('fmvHdJar') }
tasks.named('build') { dependsOn tasks.named('fmvHdJar') }
tasks.named('deliveryTest') {
  environment 'ALSOFT_DRIVERS', 'null'
  if(providers.gradleProperty('fmvTailFixture').isPresent()) systemProperty 'fmvhd.tailFixture', providers.gradleProperty('fmvTailFixture').get()
  if(providers.gradleProperty('fmvFixture').isPresent()) systemProperty 'fmvhd.fixture', providers.gradleProperty('fmvFixture').get()
}

tasks.named('stageDefinitivePackage') {
  dependsOn tasks.named('fmvHdAssets')
  into('gfx/fmvhd') { from layout.buildDirectory.dir('fmvhd/assets') }
}

tasks.register('fmvHdSourceBundle', Copy) {
  dependsOn tasks.named('fmvHdLegacySource')
  from layout.buildDirectory.file('fmvhd/videos.zip')
  into layout.buildDirectory.dir('distributions')
  rename { 'FMVHD-v0.1.0-videos.zip' }
}
tasks.named('definitiveFileDelivery') {
  if(providers.gradleProperty('currentDeliveryFormat').getOrElse('2') != '2') dependsOn tasks.named('fmvHdSourceBundle')
}

tasks.register('originalMovieSourceProbe', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.fmv.OriginalMovieSourceProbe'
  systemProperty 'java.awt.headless', 'true'
  environment 'ALSOFT_DRIVERS', 'null'
  doFirst { args providers.gradleProperty('fmvOriginalFiles').get() }
}

tasks.register('originalFmvHandoffProbe', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.fmv.OriginalFmvHandoffProbe'
  systemProperty 'java.awt.headless', 'true'
  jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
  environment 'ALSOFT_DRIVERS', 'null'
  doFirst { args providers.gradleProperty('fmvOriginalFile').get() }
}

tasks.register('fmvSplitSourceProbe', JavaExec) {
  dependsOn testClasses, tasks.named('fmvHdAssets'), tasks.named('fmvHdJar')
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.manager.FmvSplitSourceProbe'
  systemProperty 'java.awt.headless', 'true'
  environment 'ALSOFT_DRIVERS', 'null'
  doFirst {
    args layout.buildDirectory.dir('fmvhd/assets').get().asFile.absolutePath,
      tasks.named('fmvHdJar').get().archiveFile.get().asFile.absolutePath,
      providers.gradleProperty('fmvLegacyRelease').get()
  }
}
