// Packaged fallback builds must use the exact clean source that produced this manager.
tasks.register('fallbackPin') {
  outputs.upToDateWhen { false }
  outputs.dir(layout.buildDirectory.dir('generated/definitive-pin'))
  doLast {
    final String revision = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
    final boolean clean = providers.exec { commandLine 'git', 'status', '--porcelain' }.standardOutput.asText.get().trim().isEmpty()
    final File pin = layout.buildDirectory.file('generated/definitive-pin/legend/definitive/manager/definitive-fallback.properties').get().asFile
    pin.parentFile.mkdirs()
    pin.text = clean ? 'sourceRevision=' + revision + '\n' : '# Development build: source fallback is disabled.\n'
  }
}
tasks.named('processResources') {
  dependsOn fallbackPin
  from(layout.buildDirectory.dir('generated/definitive-pin'))
}
tasks.withType(AbstractArchiveTask).configureEach {
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}
// Copy after cleanup even when several delivery targets are requested together.
tasks.named('copyLibs') { dependsOn clearOutput }
// Definitive installation/package tooling (2026-10-09), AGPL v3; see LICENSE.
tasks.named('processResources') {
  dependsOn requireSkurfa
  from('integrations/skurfa/runtime-assets/scbackgroundhd/cut5/background.png') {
    into 'legend/definitive/manager'
    rename { 'hero.png' }
  }
}

tasks.register('managerJar', Jar) {
  dependsOn classes
  archiveFileName = 'definitive-manager.jar'
  destinationDirectory = layout.buildDirectory.dir('libs')
  from(sourceSets.main.output) { include 'legend/definitive/manager/**', 'legend/definitive/textures/**' }
  from('integrations/skurfa') { include 'LICENSE', 'THIRD_PARTY_NOTICES.md'; into 'META-INF/skurfa' }
  manifest { attributes 'Main-Class': 'legend.definitive.manager.ManagerMain' }
}

// Official portable 7-Zip, pinned to upstream GitHub asset digests. Never stored in Git.
tasks.register('archiveHelper') {
  inputs.property('targetOs', providers.gradleProperty('os').getOrElse(System.getProperty('os.name')))
  outputs.dir(layout.buildDirectory.dir('definitive/archive-helper'))
  doLast {
    final String target = providers.gradleProperty('os').getOrElse(System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux')
    final String name = target.startsWith('mac') ? '7z2604-mac.tar.xz' : '7z2604-linux-x64.tar.xz'
    final String expected = target.startsWith('mac') ? 'bee04358cbcbc7106273cee0e8d72916db2696c48067a3538c34d8cd6fd16578' : 'fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd'
    final File archive = layout.buildDirectory.file('definitive/' + name).get().asFile
    archive.parentFile.mkdirs()
    providers.exec { commandLine 'curl', '--fail', '--location', '--proto', '=https', '--proto-redir', '=https', '--retry', '2', '--connect-timeout', '20', '--max-time', '180', '--speed-limit', '1024', '--speed-time', '60', '--output', archive.absolutePath, 'https://github.com/ip7z/7zip/releases/download/26.04/' + name }.result.get().assertNormalExitValue()
    final String actual = java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
    if(actual != expected) throw new GradleException('Official 7-Zip archive checksum mismatch')
    final File dest = layout.buildDirectory.dir('definitive/archive-helper').get().asFile
    dest.mkdirs()
    providers.exec { commandLine 'tar', '-xJf', archive.absolutePath, '-C', dest.absolutePath }.result.get().assertNormalExitValue()
  }
}

tasks.register('stageDefinitivePackage', Sync) {
  dependsOn jar, skurfaJar, managerJar, archiveHelper
  into layout.buildDirectory.dir('definitive/package')
  from(layout.buildDirectory.dir('libs')) {
    include 'lod-game-*.jar', 'definitive-manager.jar', 'libs/**', 'gfx/**', 'patches/**', 'lang/**', 'LICENSE', 'credits.txt', 'README.md', 'log4j2.xml', 'gamecontrollerdb.txt'
    exclude '*-sources.jar'
  }
  into('bundled-mods') { from layout.buildDirectory.dir('libs/mods') }
  into('tools') { from(layout.buildDirectory.dir('definitive/archive-helper')) { include '7zz', 'License.txt', 'readme.txt', 'History.txt' } }
  from 'CREDITS'
  from 'delivery/installer'
}

tasks.register('definitiveManifest', JavaExec) {
  dependsOn stageDefinitivePackage
  classpath = files(tasks.managerJar.archiveFile)
  mainClass = 'legend.definitive.manager.ManagerMain'
  doFirst {
    final String targetOs = providers.gradleProperty('os').getOrElse(System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux')
    final String targetArch = providers.gradleProperty('arch').getOrElse(System.getProperty('os.arch'))
    final String platform = (targetOs.startsWith('mac') ? 'macos' : targetOs == 'linux' ? 'linux' : 'unsupported') + '-' + (targetArch.startsWith('arm') || targetArch.startsWith('aarch64') ? 'arm64' : 'x64')
    final String revision = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
    final String dirty = providers.exec { commandLine 'git', 'status', '--porcelain' }.standardOutput.asText.get().trim().isEmpty() ? '' : '-working-tree'
    systemProperty 'definitive.releaseTag', providers.gradleProperty('releaseTag').getOrElse('local-' + revision + dirty)
    args '--package', layout.buildDirectory.dir('definitive/package').get().asFile.absolutePath, platform, revision + dirty
  }
}

tasks.register('definitivePackage', Zip) {
  dependsOn definitiveManifest
  final String targetOs = providers.gradleProperty('os').getOrElse(System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux')
  final String targetArch = providers.gradleProperty('arch').getOrElse(System.getProperty('os.arch'))
  final String platform = (targetOs.startsWith('mac') ? 'macos' : 'linux') + '-' + (targetArch.startsWith('arm') || targetArch.startsWith('aarch64') ? 'arm64' : 'x64')
  archiveFileName = 'Legend-of-Dragoon-Definitive-' + platform + '.zip'
  destinationDirectory = layout.buildDirectory.dir('distributions')
  from layout.buildDirectory.dir('definitive/package')
  filesMatching(['Install.sh', 'bootstrap-java', 'tools/7zz']) { permissions { unix('rwxr-xr-x') } }
}

tasks.register('deliveryTest', Test) {
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  include 'legend/definitive/**'
  testLogging { events 'failed'; exceptionFormat 'full' }
  systemProperty 'java.awt.headless', 'true'
  systemProperty 'definitive.installerLog', layout.buildDirectory.file('reports/installer-test.log').get().asFile.absolutePath
  systemProperty 'definitive.locationRegistry', layout.buildDirectory.file('reports/test-installation-location.properties').get().asFile.absolutePath
}
tasks.named('check') { dependsOn deliveryTest }

// Explicit private animation inspection using the actual source methods, without rendering.
tasks.register('nativePoseProbe', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.models.NativePoseProbe'
  systemProperty 'java.awt.headless', 'true'
  systemProperty 'definitive.sourceRoot', projectDir.absolutePath
  doFirst {
    if(!providers.gradleProperty('poseAnimation').isPresent() || !providers.gradleProperty('poseOutput').isPresent()) throw new GradleException('Supply private -PposeAnimation and new private -PposeOutput paths.')
    args providers.gradleProperty('poseAnimation').get(), providers.gradleProperty('poseOutput').get()
  }
}

// Explicit synthetic GPU inspection only; never part of the default build or game.
tasks.register('nativeBattleShaderProbe', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'legend.definitive.materials.NativeBattleShaderProbe'
  systemProperty 'java.awt.headless', 'true'
  jvmArgs '--enable-native-access=ALL-UNNAMED'
  if(System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
  doFirst {
    if(!providers.gradleProperty('shaderProbeOutput').isPresent()) throw new GradleException('Supply a new report directory with -PshaderProbeOutput.')
    args projectDir.absolutePath, providers.gradleProperty('shaderProbeOutput').get()
  }
}

// Opt-in only, under xvfb-run in Linux CI. No windows on the local desktop.
tasks.register('managerWindowTest', Test) {
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  include 'legend/definitive/manager/InstallerWindowTest.class'
  testLogging { events 'failed'; exceptionFormat 'full' }
  systemProperty 'java.awt.headless', 'false'
  systemProperty 'definitive.installerLog', layout.buildDirectory.file('reports/installer-window-test.log').get().asFile.absolutePath
  systemProperty 'definitive.locationRegistry', layout.buildDirectory.file('reports/window-test-installation-location.properties').get().asFile.absolutePath
  onlyIf { System.getenv('DISPLAY') != null && System.getProperty('os.name').toLowerCase().contains('linux') }
}

// Read-only material preflight, kept outside the portable manager and runtime activation.
tasks.register('materialAtlasCheck', JavaExec) {
  dependsOn classes
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'legend.definitive.materials.MaterialAtlasCheck'
  systemProperty 'java.awt.headless', 'true'
  doFirst {
    final List<String> names = ['materialModel', 'materialTim', 'materialPack']
    if(names.any { !providers.gradleProperty(it).isPresent() }) throw new GradleException('Supply private -PmaterialModel, -PmaterialTim and -PmaterialPack paths.')
    args names.collect { providers.gradleProperty(it).get() }
  }
}

tasks.register('materialAtlasInterop', Exec) {
  dependsOn classes
  doFirst {
    commandLine providers.gradleProperty('visualPython').getOrElse('python3'), 'scripts/test-material-atlas-java.py', '--java', new File(System.getProperty('java.home'), 'bin/java').absolutePath, '--classpath', sourceSets.main.runtimeClasspath.asPath
  }
}

// Small transferable UI/bootstrap, without the engine, HD mod payload or a local JDK.
tasks.register('portableInstaller', Zip) {
  dependsOn managerJar, copyUpdaterConfig, copySupportFiles
  archiveFileName = 'Definitive-Installer.zip'
  destinationDirectory = layout.buildDirectory.dir('distributions')
  from(tasks.managerJar.archiveFile)
  from('delivery/installer') { include 'Install.sh', 'bootstrap-java' }
  from('LICENSE')
  from('CREDITS')
  filesMatching(['Install.sh', 'bootstrap-java']) { permissions { unix('rwxr-xr-x') } }
}

configurations { managerRuntime }
