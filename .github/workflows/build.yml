# Definitive build-only CI (2026-10-09). No game files, gameplay, or publishing.
name: Build and test controls

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag embedded in the approved packages
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.releaseTag || format('ci-{0}', github.sha) }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-fixtures:
    name: Original synthetic visual fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without game or mod assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check offline mapping, transparency and pose tools
        run: |
          python3 -m venv "$RUNNER_TEMP/definitive-visual-checks"
          "$RUNNER_TEMP/definitive-visual-checks/bin/python" -m pip install -r scripts/requirements-visual.txt
          for fixture in model-material-audit texture-transparency material-islands model-poses uv-footprints material-packing visual-review surface-refinement model-reference attachment-binding modelshd-roster; do
            "$RUNNER_TEMP/definitive-visual-checks/bin/python" "scripts/test-$fixture.py"
          done
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 / Steam Deck package
            runner: ubuntu-24.04
            args: -Pos=linux -Parch=x86_64 -Psteamdeck=true
          - name: macOS package
            runner: macos-15
            args: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.0+36.0.LTS'
          cache: gradle
          cache-dependency-path: |
            build.gradle
            gradle/*.gradle
            gradle/wrapper/gradle-wrapper.properties
          overwrite-settings: false
      - name: Use the reviewed Java runtime
        shell: bash
        run: |
          JAVA="$(DEFINITIVE_MANAGED_JAVA=1 /bin/bash delivery/installer/bootstrap-java "$RUNNER_TEMP/definitive-java")"
          dirname "$JAVA" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$(dirname "$(dirname "$JAVA")")" >> "$GITHUB_ENV"
      - name: Record build environment
        run: |
          uname -a
          java -version
          ./gradlew --version
      - name: Compile and package without gameplay tests
        run: ./gradlew --no-daemon --console=plain clean build definitivePackage definitiveFileDelivery portableInstaller -PreleaseTag="$RELEASE_TAG" ${{ matrix.args }}
      - name: Assemble reviewed portable entry points
        if: runner.os == 'Linux'
        run: python3 scripts/assemble-installer.py --output-dir build/distributions --tag "$RELEASE_TAG"
      - name: Check streamed FMV playback and delivery without a window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libopenal1
          ffmpeg -y -v error -f lavfi -i testsrc2=size=320x192:rate=15:duration=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 2 "$RUNNER_TEMP/fmv-fixture.mp4"
          ffmpeg -y -v error -f lavfi -i testsrc2=size=320x192:rate=15:duration=3 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 2 "$RUNNER_TEMP/fmv-tail.mp4"
          ./gradlew --no-daemon --console=plain deliveryTest -PfmvFixture="$RUNNER_TEMP/fmv-fixture.mp4" -PfmvTailFixture="$RUNNER_TEMP/fmv-tail.mp4" ${{ matrix.args }}
      - name: Verify test opt-in using a headless fixture
        run: python3 scripts/verify-test-controls.py
      - name: Check bundled ModelsHD geometry and texture handoff
        run: ./gradlew --no-daemon --console=plain modelsHdTests modelsHdJar modelsHdBundle ${{ matrix.args }}
      - name: Exercise installer window lifecycle in an isolated virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew --no-daemon --console=plain managerWindowTest ${{ matrix.args }}
      - name: Check original native shader fixtures with software OpenGL
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./gradlew --no-daemon --console=plain nativeBattleShaderProbe -PshaderProbeOutput=build/reports/native-shader ${{ matrix.args }}
      - name: Verify Linux installer shortcut parsing
        run: python3 scripts/verify-desktop-entry.py
      - name: Verify portable setup progress and failure cleanup
        run: python3 scripts/verify-portable-bootstrap.py
      - name: Verify immutable runtime pins and safe version upgrades
        run: python3 scripts/verify-runtime-pins.py
      - name: Verify crash recovery and concurrent startup
        run: python3 scripts/verify-bootstrap-locks.py
      - name: Verify publication stops on failed checks
        run: |
          python3 scripts/test-release-publication.py
          python3 scripts/test-file-delivery.py
      - name: Verify native archive fixtures
        run: python3 scripts/verify-disc-archives.py
      - name: Cross-check original material fixtures in Python and Java
        run: |
          python3 -m venv "$RUNNER_TEMP/definitive-material-checks"
          "$RUNNER_TEMP/definitive-material-checks/bin/python" -m pip install -r scripts/requirements-visual.txt
          ./gradlew --no-daemon --console=plain materialAtlasInterop -PvisualPython="$RUNNER_TEMP/definitive-material-checks/bin/python" ${{ matrix.args }}
      - name: Retain build packages and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-${{ matrix.runner }}
          path: |
            build/distributions/Legend-of-Dragoon-Definitive-*.zip
            build/distributions/Definitive-Contents-*.zip
            build/distributions/files/file-*
            build/distributions/Definitive-Installer.zip
            build/distributions/Install-Definitive.*
            build/reports/tests/deliveryTest/**
            build/reports/tests/managerWindowTest/**
            build/reports/installer-*.png
            build/reports/focused-*.png
            build/reports/native-shader/**
            build/modelshd/ModelsHD-*.jar
            build/modelshd/ModelsHD-*.zip
            build/reports/tests/modelsHdTests/**
          if-no-files-found: error
          retention-days: 14
